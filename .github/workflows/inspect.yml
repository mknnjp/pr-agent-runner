name: Inspect

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: inspect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Cache actionlint
        uses: actions/cache@v6
        with:
          path: ~/.cache/actionlint
          key: actionlint-1.7.12

      - name: Lint workflow files
        shell: bash
        run: |
          if [ ! -x "$HOME/.cache/actionlint/actionlint" ]; then
            mkdir -p "$HOME/.cache/actionlint"
            bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 "$HOME/.cache/actionlint"
          fi
          "$HOME/.cache/actionlint/actionlint" -color .github/workflows/*.yml examples/*.yml

      - name: Test with coverage
        run: pnpm test:coverage
